[package]
name = "deskact"
version = "0.1.0"
edition = "2024"

[lib]
name = "deskact_core"
path = "src/lib.rs"

[[bin]]
name = "deskact-dev"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
