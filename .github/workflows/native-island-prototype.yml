name: Native Island Window Probe

on:
  push:
    branches: [prototype/native-windows-island]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-probe:
    name: Build native Windows probe (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows App SDK acrylic shim
        run: msbuild prototypes/native-island/acrylic-shim/DeskActAcrylicShim.vcxproj /restore /p:Configuration=Release /p:Platform=x64
      - name: Check formatting
        run: cargo fmt --manifest-path prototypes/native-island/Cargo.toml -- --check
      - name: Lint probe
        run: cargo clippy --manifest-path prototypes/native-island/Cargo.toml --target x86_64-pc-windows-msvc --locked -- -D warnings
      - name: Build probe
        run: cargo build --manifest-path prototypes/native-island/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - name: Stage runnable probe
        shell: pwsh
        run: |
          $stage = "prototypes/native-island/artifact"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "prototypes/native-island/target/x86_64-pc-windows-msvc/release/deskact-native-island-probe.exe" $stage
          Copy-Item "prototypes/native-island/acrylic-shim/bin/x64/Release/DeskActAcrylicShim.dll" $stage
          Copy-Item "prototypes/native-island/acrylic-shim/bin/x64/Release/Microsoft.WindowsAppRuntime.Bootstrap.dll" $stage
          Copy-Item "prototypes/native-island/README.md" $stage
      - uses: actions/upload-artifact@v7
        with:
          name: deskact-native-island-probe-windows-x64
          path: prototypes/native-island/artifact/*
          if-no-files-found: error
          retention-days: 14
