name: Rust CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-check:
    name: Format, test, and lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libdbus-1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check and test frontend
        run: |
          npm run check
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  windows-build:
    name: Build Windows app and developer harness (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check and test frontend
        run: |
          npm run check
          npm test
      - name: Build prototype frontend
        run: npm run build
        env:
          VITE_PROTOTYPE_PREVIEWS: "true"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop app and developer harness
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin deskact --bin deskact-dev --release --locked
      - name: Run Windows integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --release --locked
      - name: Upload Windows app and developer harness
        uses: actions/upload-artifact@v7
        with:
          name: deskact-prototype-windows-x64
          path: |
            src-tauri/target/release/deskact.exe
            src-tauri/target/release/deskact-dev.exe
          if-no-files-found: error
          retention-days: 14
