name: Rust CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-check:
    name: Format, test, and lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  windows-build:
    name: Build all targets (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all targets
        run: cargo build --manifest-path src-tauri/Cargo.toml --all-targets --release --locked
      - name: Run Windows integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --release --locked
      - name: Upload Windows developer harness
        uses: actions/upload-artifact@v7
        with:
          name: deskact-dev-windows-x64
          path: src-tauri/target/release/deskact-dev.exe
          if-no-files-found: error
          retention-days: 14
